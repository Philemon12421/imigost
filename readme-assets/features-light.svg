<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 214" width="880" height="214" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">What is inside ImageSearch</title>
  <desc id="desc">Four small animated cards: photo search, the link page builder, photo tools with a crop frame that changes shape, and the Chrome extension with a right-click menu.</desc>
  <defs>
    <linearGradient id="f0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a56"/><stop offset="1" stop-color="#b44bd4"/></linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1aa6b7"/><stop offset="1" stop-color="#0f4c81"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd19e"/><stop offset="1" stop-color="#2f6f4a"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6e8"/><stop offset="1" stop-color="#ff4d9a"/></linearGradient>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f9a03a"/><stop offset=".5" stop-color="#e1306c"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <style>
    text { font-family: system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
    .tp, .sl, .menu, .hl { transform-box: fill-box; }
    .tp { transform-origin: center; animation: tp 6s ease-out infinite both; }
    @keyframes tp { 0% { opacity: 0; transform: scale(.5); } 6% { opacity: 1; transform: scale(1.06); } 9% { transform: scale(1); }
      82% { opacity: 1; transform: scale(1); } 92% { opacity: 0; transform: scale(.92); } 100% { opacity: 0; } }
    .sl { animation: sl 6s ease-out infinite both; }
    @keyframes sl { 0% { opacity: 0; transform: translateX(-18px); } 9% { opacity: 1; transform: translateX(0); }
      82% { opacity: 1; transform: translateX(0); } 92% { opacity: 0; transform: translateX(10px); } 100% { opacity: 0; } }
    .lb { opacity: 0; animation: lb 9s ease-in-out infinite both; }
    @keyframes lb { 0% { opacity: 0; } 2% { opacity: 1; } 31% { opacity: 1; } 34% { opacity: 0; } 100% { opacity: 0; } }
    .cur { animation: cur 6s cubic-bezier(.5,0,.2,1) infinite both; }
    @keyframes cur {
      0% { opacity: 0; transform: translate(176px,112px); } 4% { opacity: 1; } 24% { transform: translate(84px,58px) scale(1); }
      28% { transform: translate(84px,58px) scale(.86); } 32% { transform: translate(84px,58px) scale(1); }
      82% { opacity: 1; transform: translate(84px,58px); } 92% { opacity: 0; transform: translate(84px,58px); } 100% { opacity: 0; transform: translate(176px,112px); }
    }
    .menu { transform-origin: 0 0; animation: menu 6s ease-out infinite both; }
    @keyframes menu { 0%, 32% { opacity: 0; transform: translate(92px,66px) scale(.7); } 38% { opacity: 1; transform: translate(92px,66px) scale(1); }
      82% { opacity: 1; transform: translate(92px,66px) scale(1); } 92% { opacity: 0; transform: translate(92px,66px) scale(1); } 100% { opacity: 0; } }
    .hl { animation: hl 6s ease-in-out infinite both; }
    @keyframes hl { 0%, 46% { opacity: 0; } 52% { opacity: 1; } 82% { opacity: 1; } 92%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .lb { opacity: 0; }
      .cur { transform: translate(84px,58px); }
    }
  </style>
  <g transform="translate(0 0)">
    <rect width="202" height="214" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect class="tp" style="animation-delay:0.00s" x="27" y="22" width="70" height="52" rx="8" fill="url(#f0)"/>
    <rect class="tp" style="animation-delay:0.22s" x="27" y="80" width="70" height="36" rx="8" fill="url(#f1)"/>
    <rect class="tp" style="animation-delay:0.44s" x="105" y="22" width="70" height="34" rx="8" fill="url(#f2)"/>
    <rect class="tp" style="animation-delay:0.66s" x="105" y="62" width="70" height="54" rx="8" fill="url(#f3)"/>
    <text x="101.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#15181a">Photo search</text>
    <text x="101.0" y="175" text-anchor="middle" font-size="13" fill="#59636e">Free photos from Unsplash</text>
    <text x="101.0" y="193" text-anchor="middle" font-size="13" fill="#59636e">in a fast, installable app</text>
  </g>
  <g transform="translate(226 0)">
    <rect width="202" height="214" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
    <g class="sl" style="animation-delay:0.00s"><rect x="27" y="24" width="148" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><circle cx="44" cy="37" r="9" fill="url(#ig)"/><rect x="62" y="33.5" width="86" height="7" rx="3.5" fill="#d0d7de"/></g>
    <g class="sl" style="animation-delay:0.35s"><rect x="27" y="58" width="148" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><circle cx="44" cy="71" r="9" fill="#ff0000"/><rect x="62" y="67.5" width="76" height="7" rx="3.5" fill="#d0d7de"/></g>
    <g class="sl" style="animation-delay:0.70s"><rect x="27" y="92" width="148" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><circle cx="44" cy="105" r="9" fill="#24292f"/><rect x="62" y="101.5" width="66" height="7" rx="3.5" fill="#d0d7de"/></g>
    <text x="101.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#15181a">Link page</text>
    <text x="101.0" y="175" text-anchor="middle" font-size="13" fill="#59636e">36 looks, real brand icons,</text>
    <text x="101.0" y="193" text-anchor="middle" font-size="13" fill="#59636e">one link for everything</text>
  </g>
  <g transform="translate(452 0)">
    <rect width="202" height="214" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="27" y="22" width="148" height="94" rx="8" fill="url(#f1)"/>
    <rect x="54" y="22" width="94" height="94" fill="#3a47f0" fill-opacity=".16" stroke="#3a47f0" stroke-width="3" rx="3">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" values="54;54;75.05;75.05;27;27;54" keyTimes="0;.25;.33;.58;.66;.91;1" calcMode="spline" keySplines="0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1"/>
      <animate attributeName="y" dur="9s" repeatCount="indefinite" values="22;22;22;22;27.4;27.4;22" keyTimes="0;.25;.33;.58;.66;.91;1" calcMode="spline" keySplines="0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1"/>
      <animate attributeName="width" dur="9s" repeatCount="indefinite" values="94;94;52.9;52.9;148;148;94" keyTimes="0;.25;.33;.58;.66;.91;1" calcMode="spline" keySplines="0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1"/>
      <animate attributeName="height" dur="9s" repeatCount="indefinite" values="94;94;94;94;83.25;83.25;94" keyTimes="0;.25;.33;.58;.66;.91;1" calcMode="spline" keySplines="0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1;0 0 1 1;.5 0 .2 1"/>
    </rect>
    <text class="lb" style="animation-delay:0s" x="101.0" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#59636e">1:1</text>
    <text class="lb" style="animation-delay:3s" x="101.0" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#59636e">9:16</text>
    <text class="lb" style="animation-delay:6s" x="101.0" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#59636e">16:9</text>
    <text x="101.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#15181a">Photo tools</text>
    <text x="101.0" y="175" text-anchor="middle" font-size="13" fill="#59636e">Crop, compress, convert,</text>
    <text x="101.0" y="193" text-anchor="middle" font-size="13" fill="#59636e">and a speed test</text>
  </g>
  <g transform="translate(678 0)">
    <rect width="202" height="214" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="27" y="22" width="148" height="94" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="39" y="34" width="70" height="46" rx="5" fill="url(#f2)"/>
    <rect x="39" y="90" width="100" height="6" rx="3" fill="#d0d7de"/>
    <rect x="39" y="102" width="68" height="6" rx="3" fill="#d0d7de"/>
    <g class="menu" transform="translate(92 66)">
      <rect width="86" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <rect class="hl" x="5" y="6" width="76" height="16" rx="5" fill="#3a47f0" fill-opacity=".18"/>
      <rect x="11" y="12" width="52" height="5" rx="2.5" fill="#3a47f0"/>
      <rect x="11" y="30" width="60" height="5" rx="2.5" fill="#d0d7de"/>
    </g>
    <g class="cur"><path d="M0 0V17L4.6 12.6L8 20.6L11.2 19.2L7.8 11.4H14Z" fill="#15181a" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/></g>
    <text x="101.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#15181a">Chrome extension</text>
    <text x="101.0" y="175" text-anchor="middle" font-size="13" fill="#59636e">Right-click any image to</text>
    <text x="101.0" y="193" text-anchor="middle" font-size="13" fill="#59636e">crop or compress it</text>
  </g>
