<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">ImageSearch</title>
  <desc id="desc">The ImageSearch logo, a camera viewfinder locking focus, above rotating lines about photo search, link pages, photo tools and the speed test.</desc>
  <defs>
    <linearGradient id="t0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a56"/><stop offset="1" stop-color="#b44bd4"/></linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1aa6b7"/><stop offset="1" stop-color="#0f4c81"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd19e"/><stop offset="1" stop-color="#2f6f4a"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6e8"/><stop offset="1" stop-color="#ff4d9a"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <style>
    text { font-family: system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
    .fb { transform-box: fill-box; transform-origin: center; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .logo { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.2,1.5,.4,1) both; }
    .brackets { transform-box: fill-box; transform-origin: center; animation: hunt 6s cubic-bezier(.3,.7,.3,1) infinite .4s both; }
    .lens { transform-box: fill-box; transform-origin: center; animation: lock 6s ease-out infinite .4s both; }
    @keyframes hunt {
      0% { transform: scale(1.5); opacity: 0; } 6% { opacity: 1; } 14% { transform: scale(.86); }
      20% { transform: scale(1.1); } 26% { transform: scale(1); } 84% { transform: scale(1); opacity: 1; }
      94% { transform: scale(1); opacity: 0; } 100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes lock {
      0%, 22% { transform: scale(0); opacity: 0; } 27% { transform: scale(1.4); opacity: 1; }
      32% { transform: scale(1); opacity: 1; } 84% { opacity: 1; } 94% { transform: scale(1); opacity: 0; }
      100% { transform: scale(0); opacity: 0; }
    }

    .word { animation: rise .8s ease-out .25s both; }

    .tag { animation: tag 12s ease-in-out infinite both; }
    @keyframes tag {
      0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: translateY(0); }
      21% { opacity: 1; transform: translateY(0); } 25% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    .hopwrap { animation: fadein .35s ease-out 1.1s both; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .hop { transform-box: fill-box; transform-origin: center; animation: hop 10s cubic-bezier(.5,0,.2,1) infinite 1.2s both; }
    @keyframes hop { 0%{transform:translateX(0px) scale(1.14)} 3%{transform:translateX(0px) scale(1)} 17%{transform:translateX(0px) scale(1)} 20%{transform:translateX(132px) scale(1.14)} 23%{transform:translateX(132px) scale(1)} 37%{transform:translateX(132px) scale(1)} 40%{transform:translateX(264px) scale(1.14)} 43%{transform:translateX(264px) scale(1)} 57%{transform:translateX(264px) scale(1)} 60%{transform:translateX(396px) scale(1.14)} 63%{transform:translateX(396px) scale(1)} 77%{transform:translateX(396px) scale(1)} 80%{transform:translateX(528px) scale(1.14)} 83%{transform:translateX(528px) scale(1)} 97%{transform:translateX(528px) scale(1)} 100%{transform:translateX(0px) scale(1.14)} }
    .hopdot { transform-box: fill-box; transform-origin: center; animation: hopdot 10s ease-out infinite 1.2s both; }
    @keyframes hopdot { 0%{opacity:0;transform:scale(0)} 3%{opacity:1;transform:scale(1.4)} 5%{opacity:1;transform:scale(1)} 16%{opacity:1;transform:scale(1)} 19%{opacity:0;transform:scale(1)} 20%{opacity:0;transform:scale(0)} 23%{opacity:1;transform:scale(1.4)} 25%{opacity:1;transform:scale(1)} 36%{opacity:1;transform:scale(1)} 39%{opacity:0;transform:scale(1)} 40%{opacity:0;transform:scale(0)} 43%{opacity:1;transform:scale(1.4)} 45%{opacity:1;transform:scale(1)} 56%{opacity:1;transform:scale(1)} 59%{opacity:0;transform:scale(1)} 60%{opacity:0;transform:scale(0)} 63%{opacity:1;transform:scale(1.4)} 65%{opacity:1;transform:scale(1)} 76%{opacity:1;transform:scale(1)} 79%{opacity:0;transform:scale(1)} 80%{opacity:0;transform:scale(0)} 83%{opacity:1;transform:scale(1.4)} 85%{opacity:1;transform:scale(1)} 96%{opacity:1;transform:scale(1)} 99%{opacity:0;transform:scale(1)} 100%{opacity:0;transform:scale(0)} }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .t2, .t3, .t4 { opacity: 0; }
    }
  </style>

  <!-- logo -->
  <g transform="translate(414.0 26) scale(1.125)">
    <g class="logo">
      <rect width="64" height="64" rx="14" fill="#4f5bff"/>
      <path class="brackets" d="M14 24V14h10M40 14h10v10M50 40v10H40M24 50H14V40" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="lens" cx="32" cy="32" r="6.5" fill="#fff"/>
    </g>
  </g>

  <text class="word" x="450.0" y="170" text-anchor="middle" font-size="48" font-weight="800" letter-spacing="-1.6" fill="#f0f3f6">ImageSearch</text>

  <text class="tag t1" x="450.0" y="212" text-anchor="middle" font-size="22" fill="#9198a1" style="animation-delay:0s">Search free photos from Unsplash.</text>
  <text class="tag t2" x="450.0" y="212" text-anchor="middle" font-size="22" fill="#9198a1" style="animation-delay:3s">Build a link-in-bio page with 36 looks.</text>
  <text class="tag t3" x="450.0" y="212" text-anchor="middle" font-size="22" fill="#9198a1" style="animation-delay:6s">Crop, compress and convert photos in your browser.</text>
  <text class="tag t4" x="450.0" y="212" text-anchor="middle" font-size="22" fill="#9198a1" style="animation-delay:9s">Test your internet speed. Install it as an app.</text>

  <!-- photos and the focus frame -->
  <g class="pop" style="animation-delay:0.50s"><rect x="130.0" y="262" width="112" height="84" rx="12" fill="url(#t0)"/><circle cx="212.0" cy="289" r="8" fill="#fff" opacity=".85"/><path d="M130.0 334Q130.0 346 142.0 346H230.0Q242.0 346 242.0 334V322L206.0 302L180.0 324L164.0 312L130.0 332Z" fill="#fff" opacity=".32"/></g>
  <g class="pop" style="animation-delay:0.59s"><rect x="262.0" y="262" width="112" height="84" rx="12" fill="url(#t1)"/><circle cx="344.0" cy="289" r="8" fill="#fff" opacity=".85"/><path d="M262.0 334Q262.0 346 274.0 346H362.0Q374.0 346 374.0 334V322L338.0 302L312.0 324L296.0 312L262.0 332Z" fill="#fff" opacity=".32"/></g>
  <g class="pop" style="animation-delay:0.68s"><rect x="394.0" y="262" width="112" height="84" rx="12" fill="url(#t2)"/><circle cx="476.0" cy="289" r="8" fill="#fff" opacity=".85"/><path d="M394.0 334Q394.0 346 406.0 346H494.0Q506.0 346 506.0 334V322L470.0 302L444.0 324L428.0 312L394.0 332Z" fill="#fff" opacity=".32"/></g>
  <g class="pop" style="animation-delay:0.77s"><rect x="526.0" y="262" width="112" height="84" rx="12" fill="url(#t3)"/><circle cx="608.0" cy="289" r="8" fill="#fff" opacity=".85"/><path d="M526.0 334Q526.0 346 538.0 346H626.0Q638.0 346 638.0 334V322L602.0 302L576.0 324L560.0 312L526.0 332Z" fill="#fff" opacity=".32"/></g>
  <g class="pop" style="animation-delay:0.86s"><rect x="658.0" y="262" width="112" height="84" rx="12" fill="url(#t4)"/><circle cx="740.0" cy="289" r="8" fill="#fff" opacity=".85"/><path d="M658.0 334Q658.0 346 670.0 346H758.0Q770.0 346 770.0 334V322L734.0 302L708.0 324L692.0 312L658.0 332Z" fill="#fff" opacity=".32"/></g>

  <g class="hopwrap"><g class="hop">
    <path d="M122.0 276V254H144.0 M228.0 254H250.0V276 M250.0 332V354H228.0 M144.0 354H122.0V332" fill="none" stroke="#7c86ff" stroke-width="4" stroke-linecap="round"/>
    <circle class="hopdot" cx="186.0" cy="304.0" r="6" fill="#7c86ff"/>
  </g></g>
