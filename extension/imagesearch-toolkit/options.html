<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageSearch Toolkit settings</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        body { width: auto; min-width: 320px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        .row { display: flex; gap: 6px; }
        .row input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; background: var(--soft); border: 1.5px solid var(--line); border-radius: 9px; color: inherit; font: inherit; }
        .row input:focus { outline: none; border-color: var(--accent); }
        .row button { height: 38px; padding: 0 14px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
        .row .save { background: var(--accent); border: none; color: var(--accent-ink); }
        .row .reset { background: transparent; border: 1.5px solid var(--line); color: inherit; }
        .hint { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
    </style>
</head>
<body>
    <label for="site">Your ImageSearch site</label>
    <div class="row">
        <input id="site" type="url" placeholder="https://imigost.vercel.app" autocomplete="off" spellcheck="false">
        <button type="button" class="save" id="save">Save</button>
        <button type="button" class="reset" id="reset">Reset</button>
    </div>
    <p class="hint">The extension sends images and links to this site. Use https (or http://localhost for testing).</p>
    <p class="message" id="status" role="status"></p>

    <script src="config.js"></script>
    <script src="options.js"></script>
</body>
</html>
